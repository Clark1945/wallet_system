worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Preserve an incoming X-Trace-Id; otherwise mint one from nginx's $request_id.
    # The app's TraceIdFilter reads this header and only generates a fallback when absent,
    # so services reached directly (not via nginx) still get a trace id.
    map $http_x_trace_id $trace_id {
        default $http_x_trace_id;
        ""      $request_id;
    }

    # Honor an upstream-supplied X-Forwarded-Proto (e.g. Cloudflare terminates TLS
    # and forwards https), so Spring builds https OAuth2 redirect URIs / secure
    # cookies. Falls back to nginx's own scheme when reached directly.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    log_format trace '$remote_addr - "$request" $status '
                     'trace=$trace_id rt=$request_time ua="$http_user_agent"';
    # Write to a non-default filename on purpose: the nginx image ships
    # /var/log/nginx/access.log as a symlink to /dev/stdout, so writing there
    # only goes to stdout and never lands as a real file in the nginx_logs
    # volume. A fresh name has no symlink, so Promtail can tail it (and ship it
    # to Loki) the same file-based way it scrapes every other service.
    access_log /var/log/nginx/nginx_access.log trace;

    # wallet_system avatar uploads allow up to 2 MB; nginx's default limit is 1 MB.
    client_max_body_size 10m;

    upstream wallet  { server app:8080; }
    upstream payment { server payment-service:8082; }

    server {
        listen 80;
        server_name _;

        # Forward headers so Spring (forward-headers-strategy: framework) builds correct
        # OAuth2 redirect URIs, secure cookies, and scheme-aware absolute links.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Trace-Id        $trace_id;
        proxy_http_version 1.1;

        # payment-service: checkout pages, Stripe webhook, SBPS result.
        # Plain proxy_pass only — the webhook HMAC is computed over the raw body,
        # so nothing here may rewrite or re-encode it.
        location /payment/ {
            proxy_pass http://payment;
        }

        # Everything else → wallet_system (login, dashboard, deposit, withdraw,
        # uploads, swagger, actuator).
        location / {
            proxy_pass http://wallet;
        }
    }
}
