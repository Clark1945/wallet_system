global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (DLQ depth, RabbitMQ availability, …)
rule_files:
  - /etc/prometheus/alert.rules.yml

# Where firing alerts are sent
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  - job_name: wallet-system
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['app:8080']

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8082']

  - job_name: email-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['email-service:8083']

  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['audit-service:8084']

  - job_name: mock-bank
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['mock-bank:8081']

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']

  # Per-queue metrics. The aggregated /metrics endpoint above does NOT expose
  # per-queue depth; the detailed endpoint does. Limited to the queue_coarse_metrics
  # family to keep cardinality low. Yields rabbitmq_detailed_queue_messages{queue=…}.
  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family: ['queue_coarse_metrics']
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: postgres-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ['redis-exporter:9121']
