# Alertmanager configuration.
#
# Out of the box every alert is routed to the 'default' receiver, which has no
# notification integration — so alerts are evaluated and visible in the
# Alertmanager UI (http://localhost:9093) and Prometheus (http://localhost:9090/alerts),
# but nothing is pushed anywhere yet. To actually get notified, uncomment and fill
# in one of the receivers below (Slack or email) and point the route at it.

route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default

  # --- Slack (recommended; fill in your incoming-webhook URL) ---
  # - name: slack
  #   slack_configs:
